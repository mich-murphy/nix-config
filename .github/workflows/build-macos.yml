name: build

# GitHub usage limits currently prevent CI; local validation is required.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@v1
        with:
          send-statistics: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v1
      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@v1
      - name: Run commit hooks
        run: nix shell --inputs-from . nixpkgs#prek --command prek run --all-files
      - name: Check flake
        run: nix flake check --print-build-logs --no-write-lock-file
