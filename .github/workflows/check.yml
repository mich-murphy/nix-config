name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled run on main would stop pushing to FlakeHub Cache part-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to full commit SHAs; TODO.md (Updates) has the monthly bump.
jobs:
  # Pull requests and manual runs, on Linux only. Every host is evaluated,
  # the Macs included, but only the Linux checks are built; the Mac builds run
  # locally with `nix flake check --all-systems`. No id-token, so nothing here
  # can push to FlakeHub Cache.
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Run commit hooks
        run: nix shell --inputs-from . nixpkgs#prek --command prek run --all-files
      # Without --no-build, --all-systems would try to build the Mac checks.
      # Import-from-derivation would need a Mac build during evaluation.
      - name: Evaluate every system
        run: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false
      - name: Check flake
        run: nix flake check --print-build-logs --no-write-lock-file

  # Pushes to main only, on macOS only: the Mac checks are built, and every
  # path cache.nixos.org lacks is pushed to FlakeHub Cache for the Macs to
  # download. dev-01 does not read FlakeHub Cache, so no Linux job pushes.
  # The id-token lets FlakeHub verify the push came from this repository's
  # Actions run; no long-lived secret exists to steal.
  cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Push builds to FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@f00fba8dc0949d63cbbb7d33da7912417d588d75 # v3.24.2
      - name: Check flake
        run: nix flake check --print-build-logs --no-write-lock-file
