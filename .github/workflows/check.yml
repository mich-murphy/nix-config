name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled run on main would stop pushing to FlakeHub Cache part-way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to full commit SHAs; TODO.md (Updates) has the monthly bump.
jobs:
  # Pull requests and manual runs. No id-token, so nothing here can push to
  # FlakeHub Cache.
  check:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Run commit hooks
        if: runner.os == 'Linux'
        run: nix shell --inputs-from . nixpkgs#prek --command prek run --all-files
      - name: Check flake
        run: nix flake check --print-build-logs --no-write-lock-file

  # Pushes to main only: the same checks, and every path they build that
  # cache.nixos.org lacks is pushed to FlakeHub Cache. The id-token lets
  # FlakeHub verify the push came from this repository's Actions run; no
  # long-lived secret exists to steal.
  cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
      - name: Push builds to FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@f00fba8dc0949d63cbbb7d33da7912417d588d75 # v3.24.2
      - name: Check flake
        run: nix flake check --print-build-logs --no-write-lock-file
