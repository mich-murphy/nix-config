name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A cancelled run on main would stop pushing to the Namespace cache part-way.
  # Manual runs get their own group, so one cannot displace a pending push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to full commit SHAs; TODO.md (Updates) has the monthly bump.
jobs:
  # Pull requests and manual runs, on GitHub's Linux runner only. Every host is
  # evaluated, the Macs included, but only the Linux checks are built; the Mac
  # builds run locally with `nix flake check --all-systems`. No secret, so
  # nothing here can sign: a branch that moves this job to a Namespace runner
  # could upload with the runner's token, but hosts refuse paths without a
  # trusted signature.
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
        with:
          # The agent CLIs from llm-agents.nix, prebuilt; asked after
          # cache.nixos.org, as on the Mac.
          extra-conf: |
            extra-substituters = https://cache.numtide.com?priority=45
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Run commit hooks
        run: nix shell --inputs-from . nixpkgs#prek --command prek run --all-files
      # Without --no-build, --all-systems would try to build the Mac checks.
      # Import-from-derivation would need a Mac build during evaluation.
      - name: Evaluate every system
        run: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false
      - name: Check flake
        run: nix flake check --print-build-logs --no-write-lock-file

  # Pushes to main only, on Namespace runners: every check for each system is
  # built, and the closures are signed with nix-config-1 and copied to
  # Namespace's Nix cache through the nixcache proxy. The signing key lives in
  # the `cache` environment, which only main may use. The runner's own
  # Namespace workload token authorises the writes.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: nscloud-macos-tahoe-arm64-6x14
            system: aarch64-darwin
          - runner: nscloud-ubuntu-24.04-amd64-16x32
            system: x86_64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
        with:
          # cache.nixos.org first, then our cache through the local proxy,
          # then Numtide's agent CLIs; the same order as the hosts.
          extra-conf: |
            substituters = https://cache.nixos.org?priority=30 http://127.0.0.1:18765?priority=35 https://cache.numtide.com?priority=45
            extra-trusted-public-keys = nix-config-1:Ep0gTwAfKkQdxskDLpCKv+y5rgtysgE3Z45edow+wVw= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Start Namespace's cache proxy
        run: .github/nixcache.sh start
      - name: Build checks
        run: .github/push-cache.sh build "${{ matrix.system }}" "$RUNNER_TEMP/paths"
      - name: Sign and push them to the cache
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: .github/push-cache.sh push http://127.0.0.1:18765 "$RUNNER_TEMP/paths"
      - name: Stop the cache proxy
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP"/nix-cache-key.*
          .github/nixcache.sh stop

  # After both builds on main: fetch dev-01's profile, signed by the build job,
  # without building it (--max-jobs 0), then activate it on dev-01 with
  # deploy-rs, unless main has moved on. The SSH key lives in the `dev-01`
  # environment, which only main may use, and only the last step sees it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment: dev-01
    runs-on: nscloud-ubuntu-24.04-amd64-16x32
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
        with:
          # The build job's order and keys. always-allow-substitutes fetches
          # Home Manager's small files, signed, instead of building them here.
          extra-conf: |
            substituters = https://cache.nixos.org?priority=30 http://127.0.0.1:18765?priority=35 https://cache.numtide.com?priority=45
            extra-trusted-public-keys = nix-config-1:Ep0gTwAfKkQdxskDLpCKv+y5rgtysgE3Z45edow+wVw= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
            always-allow-substitutes = true
      - name: Start Namespace's cache proxy
        run: .github/nixcache.sh start
      - name: Fetch dev-01's profile and check its signatures
        run: .github/deploy-dev-01.sh fetch
      - name: Deploy dev-01
        env:
          DEV_01_DEPLOY_KEY: ${{ secrets.DEV_01_DEPLOY_KEY }}
        run: .github/deploy-dev-01.sh activate
      - name: Stop the cache proxy
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP"/dev-01-ssh.*
          .github/nixcache.sh stop
