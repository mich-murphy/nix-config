[workspace]
members = ["crates/adapters", "crates/app", "crates/cli", "crates/domain", "xtask"]
default-members = ["crates/adapters", "crates/app", "crates/cli", "crates/domain"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "string"] }
rusqlite = { version = "0.38", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
