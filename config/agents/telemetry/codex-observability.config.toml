[otel]
environment = "local"
log_user_prompt = false
exporter = "none"
metrics_exporter = "none"
trace_exporter = "none"

[features]
hooks = true

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'python3 "$HOME/.config/agent-observability/hooks/app_agent_hook.py" --harness codex'
timeout = 5

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.config/agent-observability/hooks/app_agent_hook.py" --harness codex'
timeout = 5

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = 'python3 "$HOME/.config/agent-observability/hooks/app_agent_hook.py" --harness codex'
timeout = 5

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.config/agent-observability/hooks/app_agent_hook.py" --harness codex'
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$HOME/.config/agent-observability/hooks/app_agent_hook.py" --harness codex'
timeout = 10

