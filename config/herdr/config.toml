# Persist the onboarding choice in the live, Git-tracked config.
onboarding = false

[theme]
name = "tokyo-night"

[keys]
prefix = "ctrl+a"

split_vertical = "prefix+|"
rename_tab = "prefix+comma"
detach = "prefix+d"

previous_workspace = "prefix+("
next_workspace = "prefix+)"
focus_agent = "prefix+shift+1..9"

# Direct chords are process-aware plugin actions that navigate
# seamlessly between Neovim and Herdr panes.

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "Navigate left (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "Navigate down (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "Navigate up (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "Navigate right (Neovim/Herdr)"

[[keys.command]]
# Ghostty translates Ctrl+Shift+L to the otherwise-unused F12 sequence.
key = "f12"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "Clear focused pane"

# Herdr Annotate terminal annotations.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "Annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "Copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "Manage annotations"

# Herdr Annotate document and agent-reply review.
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "Review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "Review the agent's last reply"

[ui]
prompt_new_tab_name = false

show_agent_labels_on_pane_borders = false
[ui.toast]
delivery = "herdr"
delay_seconds = 2

[ui.sound]
enabled = false

# Pass Kitty graphics through to Ghostty so snacks.image can render
# mermaid diagrams and images inline in Neovim. Experimental in Herdr.
[experimental]
kitty_graphics = true
