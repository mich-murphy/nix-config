version = 1

; Model paths are relative to ~/models, the router's working directory.

[*]
n-gpu-layers = all
flash-attn = on
parallel = 1
ctx-size = 131072
; Qwen3.6 and 3.8 are hybrid models: without checkpoints a partly matching
; prompt is reprocessed from the start.
ctx-checkpoints = 32
checkpoint-min-step = 1024
spec-type = draft-mtp
spec-draft-n-max = 3
sleep-idle-seconds = 300
top-k = 20
top-p = 0.95
min-p = 0.0
presence-penalty = 0.0

[qwen3.6-35b-a3b]
model = qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
mmproj = qwen3.6-35b-a3b/mmproj-F16.gguf
temp = 0.6

[qwen3.8-27b]
model = qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = qwen3.8-27b/mmproj-F16.gguf
temp = 1.0
reasoning-effort = medium
