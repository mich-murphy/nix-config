ignores:
  - "**/node_modules/**"
  # Vendored verbatim from upstream. unslop's rule numbers are stable ids with
  # gaps, which MD029 rejects. show-me has a bare code fence, which MD040 rejects.
  - "config/agents/skills/unslop/SKILL.md"
  - "config/agents/skills/show-me/SKILL.md"
config:
  line-length: false
  first-line-heading: false
  ol-prefix:
    style: ordered
  # Vendored agent skills embed a whole document — with its own H1 — as a
  # template for the agent to fill in.
  single-title: false
  no-inline-html:
    allowed_elements:
      - important
      # Skill section delimiters.
      - issue-template
      - local-ticket-template
      - spec-template
      - user-story-example
      - vertical-slice-rules
      # Angle-bracket placeholders inside those templates.
      - actor
      - benefit
      - changing
      - feature
      - NN
      - Ticket
      - X
