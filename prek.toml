minimum_prek_version = "0.4.4"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  # A patch's blank context lines are a single space; stripping it breaks the patch.
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = '\.patch$' },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "markdownlint",
    name = "markdownlint",
    language = "system",
    entry = "nix shell --inputs-from . nixpkgs#markdownlint-cli2 --command markdownlint-cli2 --config config/markdownlint-cli2.yaml",
    types = ["markdown"],
  },
  {
    id = "no-comments",
    name = "no comments (ast-grep)",
    language = "system",
    entry = "nix shell --inputs-from . nixpkgs#ast-grep --command ast-grep scan --config config/ast-grep/sgconfig.yml",
    types_or = ["nix", "shell", "yaml", "lua"],
  },
  {
    id = "no-ast-grep-ignore",
    name = "no ast-grep-ignore suppressions",
    language = "pygrep",
    entry = "ast-grep-ignore",
    types_or = ["nix", "shell", "yaml", "lua"],
  },
  {
    id = "ast-grep-rule-tests",
    name = "ast-grep rule tests",
    language = "system",
    entry = "nix shell --inputs-from . nixpkgs#ast-grep --command ast-grep test --config config/ast-grep/sgconfig.yml --skip-snapshot-tests",
    files = '^config/ast-grep/',
    pass_filenames = false,
  },
  {
    id = "zizmor",
    name = "GitHub workflow security (zizmor)",
    language = "system",
    entry = "nix shell --inputs-from . nixpkgs#zizmor --command zizmor --offline",
    files = '^\.github/workflows/.*\.ya?ml$',
  },
  {
    id = "nix-format",
    name = "nix format",
    language = "system",
    entry = "nix fmt -- --fail-on-change",
    types = ["nix"],
    require_serial = true,
  },
  {
    id = "nix-lint",
    name = "nix lint",
    language = "system",
    entry = "nix shell --inputs-from . nixpkgs#nixf-diagnose --command nixf-diagnose",
    types = ["nix"],
  },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]
