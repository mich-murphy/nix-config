minimum_prek_version = "0.4.4"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "markdownlint",
    name = "markdownlint",
    language = "system",
    entry = "nix shell --inputs-from . nixpkgs#markdownlint-cli2 --command markdownlint-cli2 --config config/markdownlint-cli2.yaml",
    types = ["markdown"],
  },
  {
    id = "nix-format",
    name = "nix format",
    language = "system",
    entry = "nix fmt -- --fail-on-change",
    types = ["nix"],
    require_serial = true,
  },
  {
    id = "nix-lint",
    name = "nix lint",
    language = "system",
    entry = "nix shell --inputs-from . nixpkgs#nixf-diagnose --command nixf-diagnose",
    types = ["nix"],
  },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]
